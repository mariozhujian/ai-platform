spring:
  sql:
    init:
      mode: never
  application:
    name: ai-platform
  servlet:
    multipart:  # spring 默认的单文件上传限制 1MB
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    model:
      chat: deepseek
      embedding: openai
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none

    deepseek:
      api-key: ${DEEPSEEK_API_KEY}

    openai:
      embedding:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        model: qwen3.7-text-embedding-flash
        api-key: ${DASHSCOPE_API_KEY}
        dimensions: 1024

    vectorstore:
      pgvector:
        initialize-schema: false # 自动初始化数据库表结构
        index-type: HNSW  # 向量索引类型，层次可导航小世界图
        distance-type: COSINE_DISTANCE # 距离度量方式：余弦距离
        dimensions: 1024 # 向量嵌入的维度是 1024 维
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch ， 单次批量写入数据库的最大文档数量
  datasource:
    url: jdbc:postgresql://101.35.29.66:5432/ai_platform?tcpKeepAlive=true
    username: postgres
    password: ${POSTGRES_PASSWORD:Zj931110}

  # Flyway 是数据库版本管理工具：把每次建表、加字段、建索引写成 SQL 文件，和代码一起提交，部署时按顺序执行。
  flyway:
    enabled: true
    locations: classpath:db/migration #指定迁移 SQL 所在目录
    baseline-on-migrate: false #不自动接管未知的已有数据库
    validate-on-migrate: true  #执行前校验已应用的迁移文件
    clean-disabled: true       #禁用 Flyway 的清空操作

knowledge:
  ocr:
    command: tesseract
    language: chi_sim+eng
    timeout-seconds: 60
    max-pages: 30
    dpi: 180
    # auto: 文字较少或者有替换字符时 OCR
    # always：每页 OCR，适用文字层残缺的文件
    mode: auto

    # 使用 qwen3.5-ocr 模型解析
    base-url: "https://llm-qpo0iraw2q488rhd.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
    api-key: ${DASHSCOPE_API_KEY}
    model: qwen3.5-ocr
